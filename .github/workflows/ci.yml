name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m unittest discover -s tests -t .
  hooks-on-old-python:
    # The hooks and session commands run on whatever python3 a laptop has.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python3 -m py_compile hooks/*.py wikiloop/config.py wikiloop/candidate.py wikiloop/inbox.py wikiloop/report_session.py wikiloop/session_summary.py oncall/*.py oncall/sources/*.py
