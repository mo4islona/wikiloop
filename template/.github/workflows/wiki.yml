name: wiki
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 core/bin/wikiloop build --check
      - run: python3 core/bin/wikiloop lint --stale
      - run: python3 core/bin/wikiloop check
